spring:
  application:
    name: kyofuse

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    url: ${DB_URL}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}
  geoip:
    database-path: ${GEOIP_DATABASE_PATH:classpath:geoip/GeoLite2-City.mmdb}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    mbeanregistry:
      enabled: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
    mfa-secret: ${MFA_JWT_SECRET}
    mfa-token-expiration-minutes: ${MFA_TOKEN_EXPIRATION_MINUTES:5}
    reactivation-secret: ${REACTIVATION_JWT_SECRET:${MFA_JWT_SECRET:${JWT_SECRET}}}
    reactivation-token-expiration-minutes: ${REACTIVATION_TOKEN_EXPIRATION_MINUTES:15}
  email-encryption:
    key: ${EMAIL_ENCRYPTION_KEY}
    index-secret: ${EMAIL_INDEX_SECRET}
  totp-encryption:
    key: ${TOTP_ENCRYPTION_KEY}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  steam:
    api-key: ${STEAM_API_KEY:}
  cookie:
    secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${app.frontend.url:http://localhost:4200}}
  rate-limit:
    login:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-minutes: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}
      lockout-minutes: ${LOGIN_RATE_LIMIT_LOCKOUT_MINUTES:1,5,15,60}
    register:
      max-attempts: ${REGISTER_RATE_LIMIT_MAX_ATTEMPTS:20}
      window-minutes: ${REGISTER_RATE_LIMIT_WINDOW_MINUTES:60}
      lockout-minutes: ${REGISTER_RATE_LIMIT_LOCKOUT_MINUTES:5,30,120}
    mfa:
      max-attempts: ${MFA_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-minutes: ${MFA_RATE_LIMIT_WINDOW_MINUTES:10}
      lockout-minutes: ${MFA_RATE_LIMIT_LOCKOUT_MINUTES:1,5,15,60}

storage:
  s3:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:kyofuse_storage_user}
    secret-key: ${STORAGE_SECRET_KEY:kyofuse_storage_secret}
    bucket: ${STORAGE_BUCKET:kyofuse-media}
    public-url: ${STORAGE_PUBLIC_URL:http://localhost:9000}

