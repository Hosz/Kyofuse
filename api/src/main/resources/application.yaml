spring:
  application:
    name: kyofuse

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    url: ${DB_URL}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  cookie:
    secure: ${COOKIE_SECURE:false}
  rate-limit:
    login:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-minutes: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}
      lockout-minutes: ${LOGIN_RATE_LIMIT_LOCKOUT_MINUTES:1,5,15,60}
    register:
      max-attempts: ${REGISTER_RATE_LIMIT_MAX_ATTEMPTS:20}
      window-minutes: ${REGISTER_RATE_LIMIT_WINDOW_MINUTES:60}
      lockout-minutes: ${REGISTER_RATE_LIMIT_LOCKOUT_MINUTES:5,30,120}
