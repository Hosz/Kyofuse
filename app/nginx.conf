map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Angular SPA routing: serve index.html for non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html so deployments immediately take effect
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache static assets (hashed JS, CSS, images, fonts)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpe?g|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # DNS resolver for upstream proxying
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    # Proxy API requests to the Spring Boot backend
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-IP $client_real_ip;
        proxy_set_header X-Client-Country $http_cf_ipcountry;
        proxy_set_header X-Client-City $http_cf_ipcity;
        proxy_set_header X-Client-Region $http_cf_region;
        proxy_set_header X-Client-Region-Code $http_cf_region_code;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-IPCity $http_cf_ipcity;
        proxy_set_header CF-Region $http_cf_region;
        proxy_set_header CF-Region-Code $http_cf_region_code;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Proxy WebSocket / STOMP connections
    location /ws {
        proxy_pass http://api:8080/ws;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-IP $client_real_ip;
        proxy_set_header X-Client-Country $http_cf_ipcountry;
        proxy_set_header X-Client-City $http_cf_ipcity;
        proxy_set_header X-Client-Region $http_cf_region;
        proxy_set_header X-Client-Region-Code $http_cf_region_code;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-IPCity $http_cf_ipcity;
        proxy_set_header CF-Region $http_cf_region;
        proxy_set_header CF-Region-Code $http_cf_region_code;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
