<label class="flex flex-col gap-1.5">
  <span class="text-label-sm font-semibold uppercase tracking-[0.06em] text-on-surface-variant">{{ label() }}</span>
  <span
    class="flex items-center gap-2 rounded-lg border bg-surface-container px-3 py-2.5 transition-colors focus-within:ring-2 focus-within:ring-primary-container/40"
    [class]="hasError() ? 'border-error' : 'border-outline-variant focus-within:border-primary-container'"
  >
    <span class="material-symbols-outlined shrink-0 text-[18px] text-on-surface-variant">{{ icon() }}</span>
    <ng-content></ng-content>
  </span>
  @if (hasError() && errorMessage()) {
    <span class="text-label-sm text-error">{{ errorMessage() }}</span>
  }
</label>
