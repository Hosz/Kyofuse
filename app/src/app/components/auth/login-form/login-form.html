<form class="flex flex-col gap-lg" (submit)="$event.preventDefault(); onSubmit()" novalidate>
  <app-auth-field
    label="Login"
    icon="person"
    [hasError]="showLoginError()"
    [errorMessage]="loginError()"
  >
    <input
      type="text"
      autocomplete="login"
      placeholder="nome@agencia.com / nome de usuário"
      [value]="login()"
      [disabled]="loading()"
      (input)="onLoginChange($any($event.target).value)"
      (blur)="loginTouched.set(true)"
      class="w-full border-0 bg-transparent text-body-sm text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:ring-0 disabled:opacity-50"
    />
  </app-auth-field>

  <app-auth-field
    label="Senha de acesso"
    icon="lock"
    [hasError]="showPasswordError()"
    [errorMessage]="passwordError()"
  >
    <input
      [type]="showPassword() ? 'text' : 'password'"
      autocomplete="current-password"
      placeholder="Sua senha"
      [value]="password()"
      [disabled]="loading()"
      (input)="onPasswordChange($any($event.target).value)"
      (blur)="passwordTouched.set(true)"
      class="w-full border-0 bg-transparent text-body-sm text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:ring-0 disabled:opacity-50"
    />
    <button
      type="button"
      (click)="toggleShowPassword()"
      [disabled]="loading()"
      [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
      class="shrink-0 cursor-pointer rounded p-0.5 text-on-surface-variant transition-colors hover:text-on-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container disabled:opacity-50"
    >
      <span class="material-symbols-outlined text-[18px]">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
    </button>
  </app-auth-field>

  <div class="flex justify-end -mt-2">
    <button
      type="button"
      (click)="forgotPassword.emit()"
      [disabled]="loading()"
      class="cursor-pointer text-label-sm text-on-surface-variant transition-colors hover:text-primary-container focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container rounded disabled:opacity-50"
    >
      Esqueceu a senha?
    </button>
  </div>

  <button
    type="submit"
    [disabled]="loading()"
    class="ignite-glow flex cursor-pointer items-center justify-center gap-2 rounded-lg bg-primary-container px-6 py-3 text-label-md font-bold uppercase tracking-[0.04em] text-on-primary-container transition-all hover:brightness-110 active:scale-[0.98] active:brightness-95 disabled:cursor-not-allowed disabled:opacity-60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface-container"
  >
    @if (loading()) {
      <span class="inline-block h-5 w-5 animate-spin rounded-full border-2 border-on-primary-container border-t-transparent"></span>
      <span>Autenticando...</span>
    } @else {
      <span class="material-symbols-outlined text-[20px]">login</span>
      <span>Entrar</span>
    }
  </button>
</form>
