<div class="flex flex-col gap-lg">
  <div class="flex items-center gap-3">
    <span class="h-px flex-1 bg-outline-variant"></span>
    <span class="text-label-sm font-semibold uppercase tracking-[0.08em] text-on-surface-variant">Ou utilize</span>
    <span class="h-px flex-1 bg-outline-variant"></span>
  </div>

  <div class="grid grid-cols-2 gap-3">
    <!-- Google Button Wrapper -->
    <div class="relative flex h-[42px] cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-secondary-fixed transition-all hover:brightness-95 active:scale-[0.97]">
      <div class="pointer-events-none flex items-center justify-center gap-2 px-4 py-2.5 text-label-md font-bold text-on-secondary">
        <span class="flex h-5 w-5 items-center justify-center rounded-full bg-on-secondary text-[11px] font-bold text-secondary-fixed">G</span>
        Google
      </div>
      <!-- Native Google GIS button overlay to open official modal popup -->
      <div #googleBtnContainer class="absolute inset-0 flex items-center justify-center opacity-[0.0001] cursor-pointer scale-150 overflow-hidden"></div>
    </div>

    <!-- Steam Button -->
    <button
      type="button"
      (click)="steamClick.emit()"
      class="flex h-[42px] cursor-pointer items-center justify-center gap-2 rounded-lg bg-[#171a21] px-4 py-2.5 text-label-md font-bold text-white transition-all hover:brightness-125 active:scale-[0.97] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface-container"
    >
      <span class="material-symbols-outlined text-[18px]">sports_esports</span>
      Steam
    </button>
  </div>
</div>
