<aside class="scrollbar-minimal flex h-screen w-96 shrink-0 flex-col overflow-y-auto border-r border-outline-variant bg-surface">
  <div class="sticky top-0 z-10 flex flex-col gap-md border-b border-outline-variant bg-surface/90 px-lg py-lg backdrop-blur-md supports-[backdrop-filter]:bg-surface/70">
    <app-search-bar placeholder="Buscar conversas..." />

    <div class="flex items-center justify-between">
      <h2 class="text-label-md font-bold uppercase tracking-[0.05em] text-on-surface">Conversas</h2>
      <button
        type="button"
        (click)="newConversation.emit()"
        aria-label="Nova conversa"
        class="cursor-pointer rounded-full p-1.5 text-on-surface-variant transition-colors hover:bg-surface-container-high hover:text-on-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface"
      >
        <span class="material-symbols-outlined text-[22px]">chat_add_on</span>
      </button>
    </div>

    <div class="flex items-center gap-1 rounded-lg border border-outline-variant p-1">
      @for (filter of filters; track filter.value) {
        <button
          type="button"
          (click)="setFilter(filter.value)"
          [attr.aria-pressed]="!showRequestsOnly() && activeFilter() === filter.value"
          class="flex-1 cursor-pointer whitespace-nowrap rounded-md px-2 py-1.5 text-label-sm font-bold transition-colors"
          [class]="
            !showRequestsOnly() && activeFilter() === filter.value
              ? 'bg-primary-container text-on-primary-container'
              : 'text-on-surface-variant hover:text-on-surface'
          "
        >
          {{ filter.label }}
        </button>
      }
    </div>

    @if (requestsCount() > 0) {
      <button
        type="button"
        (click)="toggleRequestsFilter()"
        [attr.aria-pressed]="showRequestsOnly()"
        class="flex cursor-pointer items-center justify-between rounded-lg px-4 py-2.5 text-label-md font-bold text-on-primary-container transition-colors hover:brightness-110 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface"
        [class]="showRequestsOnly() ? 'bg-primary-container' : 'bg-primary-container/80'"
      >
        <span class="flex items-center gap-2">
          <span class="h-2 w-2 rounded-full bg-on-primary-container"></span>
          {{ requestsCount() }} {{ requestsCount() === 1 ? 'SOLICITAÇÃO' : 'SOLICITAÇÕES' }}
        </span>
        <span class="material-symbols-outlined text-[18px]">{{ showRequestsOnly() ? 'close' : 'arrow_forward' }}</span>
      </button>
    }
  </div>

  <div class="flex flex-col">
    @for (conversation of visibleConversations(); track conversation.id) {
      <button
        type="button"
        (click)="select.emit(conversation)"
        [attr.aria-current]="conversation.id === selectedId() ? 'true' : null"
        class="flex cursor-pointer items-center gap-3 border-b border-outline-variant px-lg py-md text-left transition-colors hover:bg-surface-container-high focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary-container"
        [class]="conversation.id === selectedId() ? 'bg-surface-container-high' : ''"
      >
        <div class="relative shrink-0">
          <img
            [src]="conversation.participant.avatarUrl"
            [alt]="conversation.participant.name"
            class="h-12 w-12 rounded-full object-cover"
          />
          @if (conversation.type === 'DIRECT' && conversation.participant.online) {
            <span class="absolute bottom-0 right-0 h-3.5 w-3.5 rounded-full border-2 border-surface bg-emerald-400 shadow-sm shadow-emerald-500/50"></span>
          }
        </div>

        <div class="flex min-w-0 flex-1 flex-col gap-0.5">
          <div class="flex items-center justify-between gap-2">
            <span class="truncate text-body-sm font-semibold text-on-surface">{{ conversation.participant.name }}</span>
            <span class="shrink-0 text-label-sm text-on-surface-variant">{{ conversation.lastMessageAt }}</span>
          </div>
          <div class="flex items-center justify-between gap-2">
            @if (conversation.isTyping) {
              <span class="flex items-center gap-1.5 truncate text-label-md italic font-medium text-emerald-400">
                <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                {{ conversation.typingText || 'Está digitando...' }}
              </span>
            } @else {
              <span class="truncate text-label-md text-on-surface-variant" [class.font-semibold]="conversation.unread" [class.text-on-surface]="conversation.unread">
                {{ previewLabel(conversation) }}
              </span>
            }
            @if (conversation.unreadCount && conversation.unreadCount > 0) {
              <span class="flex h-5 min-w-5 shrink-0 items-center justify-center rounded-full bg-primary px-1.5 text-label-sm font-bold text-on-primary shadow-sm">
                {{ conversation.unreadCount > 99 ? '99+' : conversation.unreadCount }}
              </span>
            } @else if (conversation.unread) {
              <span class="h-2.5 w-2.5 shrink-0 rounded-full bg-primary-container"></span>
            }
          </div>
        </div>
      </button>
    } @empty {
      <p class="px-lg py-10 text-center text-body-sm text-on-surface-variant">Nenhuma conversa por aqui.</p>
    }
  </div>
</aside>
