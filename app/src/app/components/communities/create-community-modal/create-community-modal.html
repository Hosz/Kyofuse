<app-modal [open]="open()" [title]="'modals.createCommunityTitle' | trans" (closed)="onClose()">
  <div class="flex flex-col gap-md">
    <label class="flex flex-col gap-1.5">
      <span class="text-label-sm font-semibold text-on-surface-variant">{{ 'communities.name' | trans }}</span>
      <input
        type="text"
        maxlength="80"
        placeholder="Kyofuse CS2"
        [value]="name()"
        (input)="onNameChange($any($event.target).value)"
        class="rounded-lg border border-outline-variant bg-surface px-3 py-2.5 text-body-sm text-on-surface outline-none focus:border-primary"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-label-sm font-semibold text-on-surface-variant">{{ 'communities.slug' | trans }}</span>
      <input
        type="text"
        maxlength="100"
        placeholder="kyofuse-cs2"
        [value]="slug()"
        (input)="onSlugChange($any($event.target).value)"
        class="rounded-lg border border-outline-variant bg-surface px-3 py-2.5 text-body-sm text-on-surface outline-none focus:border-primary"
      />
      <span class="text-label-sm text-on-surface-variant">{{ 'communities.slugRule' | trans }}</span>
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-label-sm font-semibold text-on-surface-variant">{{ 'communities.description' | trans }}</span>
      <textarea
        rows="3"
        maxlength="500"
        [value]="description()"
        (input)="description.set($any($event.target).value)"
        class="resize-none rounded-lg border border-outline-variant bg-surface px-3 py-2.5 text-body-sm text-on-surface outline-none focus:border-primary"
      ></textarea>
    </label>

    <div class="flex flex-col gap-2">
      <input
        #modalAvatarInput
        type="file"
        accept="image/png,image/jpeg,image/webp,image/gif"
        (change)="onAvatarFileSelected($event)"
        class="hidden"
      />
      <div class="flex items-center justify-between">
        <span class="text-label-sm font-semibold text-on-surface-variant">{{ 'communities.avatarTitle' | trans }}</span>
        <button
          type="button"
          (click)="modalAvatarInput.click()"
          [disabled]="uploadingAvatar()"
          class="flex cursor-pointer items-center gap-1.5 rounded-lg bg-surface-container px-3 py-1.5 text-label-sm font-semibold text-primary hover:bg-surface-container-high disabled:cursor-not-allowed disabled:opacity-50"
        >
          @if (uploadingAvatar()) {
            <span class="inline-block h-3.5 w-3.5 animate-spin rounded-full border-2 border-primary border-t-transparent"></span>
            <span>{{ 'common.uploading' | trans }}</span>
          } @else {
            <span class="material-symbols-outlined text-[16px]">upload</span>
            <span>{{ avatarUrl() ? ('profileEdit.changeAvatar' | trans) : ('profileEdit.uploadPhoto' | trans) }}</span>
          }
        </button>
      </div>
      <div class="flex items-center gap-3 rounded-lg border border-outline-variant bg-surface-container-low p-2">
        <img [src]="avatarUrl() || defaultAvatar" alt="Avatar" class="h-12 w-12 rounded-lg object-cover" />
        <span class="flex-1 truncate text-label-sm text-on-surface">
          {{ avatarUrl() ? ('communities.photoSelected' | trans) : ('communities.defaultPhotoOptional' | trans) }}
        </span>
        @if (avatarUrl()) {
          <button
            type="button"
            (click)="removeAvatar()"
            class="cursor-pointer text-on-surface-variant hover:text-error"
            [title]="'profileEdit.removePhoto' | trans"
          >
            <span class="material-symbols-outlined text-[18px]">delete</span>
          </button>
        }
      </div>
    </div>

    <div class="flex flex-col gap-2">
      <input
        #modalBannerInput
        type="file"
        accept="image/png,image/jpeg,image/webp,image/gif"
        (change)="onBannerFileSelected($event)"
        class="hidden"
      />
      <div class="flex items-center justify-between">
        <span class="text-label-sm font-semibold text-on-surface-variant">{{ 'communities.bannerTitle' | trans }}</span>
        <button
          type="button"
          (click)="modalBannerInput.click()"
          [disabled]="uploadingBanner()"
          class="flex cursor-pointer items-center gap-1.5 rounded-lg bg-surface-container px-3 py-1.5 text-label-sm font-semibold text-primary hover:bg-surface-container-high disabled:cursor-not-allowed disabled:opacity-50"
        >
          @if (uploadingBanner()) {
            <span class="inline-block h-3.5 w-3.5 animate-spin rounded-full border-2 border-primary border-t-transparent"></span>
            <span>{{ 'common.uploading' | trans }}</span>
          } @else {
            <span class="material-symbols-outlined text-[16px]">upload</span>
            <span>{{ bannerUrl() ? ('profileEdit.changeBanner' | trans) : ('profileEdit.uploadBanner' | trans) }}</span>
          }
        </button>
      </div>
      @if (bannerUrl()) {
        <div class="relative h-20 w-full overflow-hidden rounded-lg border border-outline-variant">
          <img [src]="bannerUrl()" alt="Banner" class="h-full w-full object-cover" />
          <button
            type="button"
            (click)="removeBanner()"
            class="absolute right-2 top-2 flex h-6 w-6 cursor-pointer items-center justify-center rounded-full bg-black/60 text-white hover:bg-error"
            [title]="'profileEdit.removeBanner' | trans"
          >
            <span class="material-symbols-outlined text-[16px]">close</span>
          </button>
        </div>
      }
    </div>

    <label class="flex flex-col gap-1.5">
      <span class="text-label-sm font-semibold text-on-surface-variant">{{ 'communities.visibility' | trans }}</span>
      <select
        [value]="visibility()"
        (change)="visibility.set($any($event.target).value)"
        class="rounded-lg border border-outline-variant bg-surface px-3 py-2.5 text-body-sm text-on-surface outline-none focus:border-primary"
      >
        <option value="PUBLIC">{{ 'communities.visibilityPublicDesc' | trans }}</option>
        <option value="PRIVATE">{{ 'communities.visibilityPrivateDesc' | trans }}</option>
      </select>
    </label>

    @if (error()) {
      <p class="text-label-sm text-error">{{ error() }}</p>
    }

    <div class="flex justify-end gap-2">
      <button
        type="button"
        (click)="onClose()"
        [disabled]="saving()"
        class="cursor-pointer rounded-full border border-outline-variant px-4 py-2 text-label-md font-bold text-on-surface transition-colors hover:bg-surface-container-high disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ 'common.cancel' | trans }}
      </button>
      <button
        type="button"
        (click)="submit()"
        [disabled]="saving() || uploadingAvatar() || uploadingBanner()"
        class="cursor-pointer rounded-full bg-primary-container px-4 py-2 text-label-md font-bold text-on-primary-container transition-colors hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ saving() ? ('common.loading' | trans) : ('modals.createCommunityTitle' | trans) }}
      </button>
    </div>
  </div>
</app-modal>
