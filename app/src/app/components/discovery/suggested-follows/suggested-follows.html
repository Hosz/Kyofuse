<section class="flex flex-col gap-md rounded-xl bg-surface-container p-md">
  <h2 class="border-l-4 border-primary-container pl-3 text-label-md font-bold uppercase tracking-[0.05em] text-on-surface">
    Sugestões para seguir
  </h2>

  <div class="flex flex-col gap-md">
    @for (profile of profiles(); track profile.handle) {
      <app-user-row
        [name]="profile.name"
        [handle]="profile.handle"
        [avatarUrl]="profile.avatarUrl"
        [isFollowing]="isFollowing(profile.handle)"
        (actionClick)="onToggleFollow(profile)"
      />
    }
  </div>

  <a href="#" class="rounded text-label-md font-semibold text-primary-container transition-colors hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface">Ver mais</a>
</section>
