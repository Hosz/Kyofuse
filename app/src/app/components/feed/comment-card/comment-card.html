<div
  class="flex gap-3 border-b border-outline-variant px-lg py-md transition-colors last:border-b-0"
  [class.bg-primary-container/10]="highlighted()"
>
  <a
    [routerLink]="['/perfil', comment().author.handle]"
    (click)="$event.stopPropagation()"
    class="shrink-0 rounded-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface"
  >
    <img
      [src]="comment().author.avatarUrl"
      [alt]="comment().author.name"
      class="h-9 w-9 shrink-0 rounded-full object-cover transition-opacity hover:opacity-90"
    />
  </a>

  <div class="flex flex-1 flex-col gap-1">
    <div class="flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 text-body-sm">
        <a
          [routerLink]="['/perfil', comment().author.handle]"
          (click)="$event.stopPropagation()"
          class="rounded font-bold text-on-surface hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface"
          >{{ comment().author.name }}</a
        >
        <span class="text-on-surface-variant">&#64;{{ comment().author.handle }} · {{ comment().timeAgo }}</span>
      </div>
      <app-user-options-menu
        [userId]="comment().authorId"
        [canBlock]="!isMine()"
        [canDeleteContent]="isMine()"
        contentLabel="comentário"
        (deleteContent)="askDelete()"
        (blocked)="authorBlocked.emit(comment().authorId)"
      />
    </div>

    <p class="text-body-sm text-on-surface">{{ comment().content }}</p>

    <app-reaction-summary
      [postId]="comment().postId"
      [commentId]="comment().id"
      [likeCount]="comment().stats.likes"
      [reactionCount]="comment().stats.reactions"
      (openList)="reactions.openList()"
    />

    <div class="flex items-center pt-1 text-on-surface-variant">
      <app-reaction-button
        #reactions
        [postId]="comment().postId"
        [commentId]="comment().id"
        [likeCount]="comment().stats.likes"
        [reactionCount]="comment().stats.reactions"
      />
    </div>
  </div>
</div>

<app-confirm-dialog
  [open]="confirmDeleteOpen()"
  title="Apagar comentário"
  message="O comentário sai do post. Não dá para desfazer."
  confirmLabel="Apagar"
  [pending]="deleting()"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()"
/>
