<div
  class="flex gap-2.5 sm:gap-3 border-b border-outline-variant px-3.5 py-3 sm:px-lg sm:py-md transition-colors last:border-b-0 min-w-0 w-full overflow-hidden"
  [class.bg-primary-container/10]="highlighted()"
>
  <a
    [routerLink]="['/perfil', comment().author.handle]"
    (click)="$event.stopPropagation()"
    class="shrink-0 rounded-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface"
  >
    <img
      [src]="comment().author.avatarUrl"
      [alt]="comment().author.name"
      class="h-8 w-8 sm:h-9 sm:w-9 shrink-0 rounded-full object-cover transition-opacity hover:opacity-90"
    />
  </a>

  <div class="flex flex-1 min-w-0 flex-col gap-1">
    <div class="flex items-center justify-between gap-2 min-w-0">
      <div class="flex flex-wrap items-center gap-1.5 sm:gap-2 text-body-sm min-w-0">
        <a
          [routerLink]="['/perfil', comment().author.handle]"
          (click)="$event.stopPropagation()"
          class="rounded font-bold text-on-surface hover:underline truncate focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface"
          >{{ comment().author.name }}</a
        >
        <span class="text-on-surface-variant truncate text-label-sm sm:text-body-sm">&#64;{{ comment().author.handle }} · {{ comment().timeAgo }}</span>
      </div>
      <app-user-options-menu
        [userId]="comment().authorId"
        [canBlock]="!isMine()"
        [canDeleteContent]="isMine()"
        contentLabel="comentário"
        (deleteContent)="askDelete()"
        (blocked)="authorBlocked.emit(comment().authorId)"
      />
    </div>

    <app-post-content [content]="comment().content"></app-post-content>

    <app-reaction-summary
      [postId]="comment().postId"
      [commentId]="comment().id"
      [likeCount]="comment().stats.likes"
      [reactionCount]="comment().stats.reactions"
      (openList)="reactions.openList()"
    />

    <div class="flex items-center pt-1 text-on-surface-variant">
      <app-reaction-button
        #reactions
        [postId]="comment().postId"
        [commentId]="comment().id"
        [likeCount]="comment().stats.likes"
        [reactionCount]="comment().stats.reactions"
        [currentUserReaction]="comment().currentUserReaction"
      />
    </div>
  </div>
</div>

<app-confirm-dialog
  [open]="confirmDeleteOpen()"
  [title]="'feed.deletePostTitle' | trans"
  [message]="'chat.deleteMessageConfirm' | trans"
  [confirmLabel]="'common.delete' | trans"
  [cancelLabel]="'common.cancel' | trans"
  [pending]="deleting()"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()"
/>
