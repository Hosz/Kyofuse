<div class="flex flex-col gap-md border-b border-outline-variant px-lg py-md">
  <input
    #fileInput
    type="file"
    multiple
    accept="image/png,image/jpeg,image/webp,image/gif"
    (change)="onFilesSelected($event)"
    class="hidden"
  />

  <div class="flex gap-md">
    <img
      [src]="currentUserAvatar() || fallbackAvatar"
      alt="Seu avatar"
      class="h-12 w-12 shrink-0 rounded-full object-cover"
    />
    <div class="flex flex-1 flex-col gap-2">
      <app-mention-input
        [rows]="2"
        [placeholder]="'composer.placeholder' | trans"
        [attr.aria-label]="'composer.placeholder' | trans"
        [content]="content()"
        (contentChange)="onContentChange($event)"
        class="w-full resize-none border-0 bg-transparent text-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:ring-0"
      ></app-mention-input>

      <!-- Previews das imagens anexadas -->
      @if (mediaItems().length > 0) {
        <div class="grid grid-cols-2 gap-2 sm:grid-cols-4 pt-2">
          @for (media of mediaItems(); track media.fileKey; let i = $index) {
            <div class="group relative aspect-video overflow-hidden rounded-xl border border-outline-variant bg-surface-container">
              <img
                [src]="media.thumbnailUrl || media.url"
                alt="Prévia do anexo"
                class="h-full w-full object-cover transition-transform duration-200 group-hover:scale-105"
              />
              <button
                type="button"
                (click)="removeMedia(i)"
                class="absolute right-1.5 top-1.5 flex h-6 w-6 cursor-pointer items-center justify-center rounded-full bg-black/70 text-white transition-opacity hover:bg-black/90 focus-visible:outline-none"
                title="Remover anexo"
              >
                <span class="material-symbols-outlined text-[14px]">close</span>
              </button>
            </div>
          }
        </div>
      }

      @if (uploading()) {
        <div class="flex items-center gap-2 py-1 text-label-sm text-primary">
          <span class="inline-block h-3.5 w-3.5 animate-spin rounded-full border-2 border-primary border-t-transparent"></span>
          <span>Enviando imagem...</span>
        </div>
      }
    </div>
  </div>

  <div class="flex flex-wrap items-center justify-between gap-3 pl-0 sm:pl-16">
    <div class="flex items-center gap-1 text-primary">
      <button
        type="button"
        (click)="triggerFileInput()"
        [disabled]="uploading() || mediaItems().length >= 4"
        class="cursor-pointer rounded-full p-2 transition-colors hover:bg-surface-container-high active:bg-surface-container-highest disabled:cursor-not-allowed disabled:opacity-40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface"
        [attr.aria-label]="'composer.addImage' | trans"
        [title]="mediaItems().length >= 4 ? 'Limite de 4 imagens atingido' : ('composer.addImage' | trans)"
      >
        <span class="material-symbols-outlined text-[22px]">image</span>
      </button>
      <button
        type="button"
        (click)="comingSoon('O envio de GIFs')"
        class="cursor-pointer rounded-full p-2 transition-colors hover:bg-surface-container-high active:bg-surface-container-highest focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface"
        [attr.aria-label]="'composer.addGif' | trans"
        [attr.title]="('composer.addGif' | trans) + ' (' + ('common.comingSoon' | trans) + ')'"
      >
        <span class="material-symbols-outlined text-[22px]">gif_box</span>
      </button>
      <button
        type="button"
        (click)="comingSoon('A criação de enquetes')"
        class="cursor-pointer rounded-full p-2 transition-colors hover:bg-surface-container-high active:bg-surface-container-highest focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface"
        [attr.aria-label]="'composer.createPoll' | trans"
        [attr.title]="('composer.createPoll' | trans) + ' (' + ('common.comingSoon' | trans) + ')'"
      >
        <span class="material-symbols-outlined text-[22px]">poll</span>
      </button>
      <button
        type="button"
        (click)="comingSoon('O seletor de emojis')"
        class="cursor-pointer rounded-full p-2 transition-colors hover:bg-surface-container-high active:bg-surface-container-highest focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface"
        [attr.aria-label]="'composer.addEmoji' | trans"
        [attr.title]="('composer.addEmoji' | trans) + ' (' + ('common.comingSoon' | trans) + ')'"
      >
        <span class="material-symbols-outlined text-[22px]">mood</span>
      </button>
    </div>

    <button
      type="button"
      (click)="onPublish()"
      [disabled]="(!content().trim() && mediaItems().length === 0) || uploading() || publishing()"
      class="ignite-glow cursor-pointer rounded-full bg-primary-container px-6 py-2.5 text-label-md font-bold text-on-primary-container transition-all hover:brightness-110 active:scale-[0.97] active:brightness-95 disabled:cursor-not-allowed disabled:opacity-40 disabled:shadow-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface"
    >
      {{ publishing() ? ('composer.publishing' | trans) : ('composer.publish' | trans) }}
    </button>
  </div>
</div>
