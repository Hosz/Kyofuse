@if (cookieService.bannerVisible()) {
  <aside
    role="region"
    [attr.aria-label]="'cookieConsent.bannerTitle' | trans"
    class="fixed bottom-4 left-4 right-4 z-50 mx-auto max-w-[42rem] rounded-2xl border border-outline-variant bg-surface-container-high/95 p-5 shadow-2xl backdrop-blur-md transition-all duration-300 sm:bottom-6 sm:left-6 sm:right-6 md:p-6"
  >
    <div class="flex flex-col gap-4">
      <div class="flex items-start gap-3.5">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-primary-container/20 text-primary-container">
          <span class="material-symbols-outlined text-[24px]">cookie</span>
        </div>
        <div class="flex flex-1 flex-col gap-1">
          <h3 class="text-title-sm font-bold text-on-surface">
            {{ 'cookieConsent.bannerTitle' | trans }}
          </h3>
          <p class="text-body-sm text-on-surface-variant leading-relaxed">
            {{ 'cookieConsent.bannerDesc' | trans }}
          </p>
          <div class="flex flex-wrap items-center gap-3 pt-1 text-label-sm">
            <a
              routerLink="/cookies"
              (click)="cookieService.closePreferences()"
              class="font-semibold text-primary hover:underline"
            >
              {{ 'cookieConsent.cookiePolicyLink' | trans }}
            </a>
            <span class="text-outline">·</span>
            <a
              routerLink="/privacidade"
              (click)="cookieService.closePreferences()"
              class="font-semibold text-primary hover:underline"
            >
              {{ 'cookieConsent.privacyPolicyLink' | trans }}
            </a>
          </div>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-end gap-2.5 border-t border-outline-variant/60 pt-3.5">
        <button
          type="button"
          (click)="openPreferences()"
          class="cursor-pointer rounded-lg px-3.5 py-2 text-label-sm font-medium text-on-surface-variant transition-colors hover:bg-surface-container hover:text-on-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
        >
          {{ 'cookieConsent.customize' | trans }}
        </button>

        <button
          type="button"
          (click)="acceptEssential()"
          class="cursor-pointer rounded-lg border border-outline-variant bg-surface-container px-4 py-2 text-label-sm font-semibold text-on-surface transition-colors hover:bg-surface-container-highest hover:border-outline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
        >
          {{ 'cookieConsent.acceptEssential' | trans }}
        </button>

        <button
          type="button"
          (click)="acceptAll()"
          class="ignite-glow cursor-pointer rounded-lg bg-primary-container px-5 py-2 text-label-sm font-bold uppercase tracking-[0.03em] text-on-primary-container transition-all hover:brightness-110 active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
        >
          {{ 'cookieConsent.acceptAll' | trans }}
        </button>
      </div>
    </div>
  </aside>
}
