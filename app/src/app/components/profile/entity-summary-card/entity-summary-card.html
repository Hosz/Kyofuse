<section class="flex flex-col gap-md rounded-xl bg-surface-container p-md">
  <h2 class="border-l-4 border-primary-container pl-3 text-label-md font-bold uppercase tracking-[0.05em] text-on-surface">
    {{ title() }}
  </h2>

  <div class="flex flex-col gap-md">
    @for (item of previewItems(); track item.id) {
      <a
        [routerLink]="item.route"
        class="flex items-center gap-3 rounded-lg transition-colors hover:bg-surface-container-high focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface-container"
      >
        @if (item.imageUrl) {
          <img [src]="item.imageUrl" [alt]="item.name" class="h-11 w-11 shrink-0 rounded-lg object-cover" />
        } @else {
          <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg bg-tertiary-container/20 text-tertiary">
            <span class="material-symbols-outlined text-[22px]">{{ item.icon }}</span>
          </div>
        }
        <div class="flex flex-col">
          <span class="text-body-sm font-semibold text-on-surface">{{ item.name }}</span>
          <span class="text-label-sm uppercase text-on-surface-variant">{{ item.meta }}</span>
        </div>
      </a>
    } @empty {
      <p class="text-body-sm text-on-surface-variant">{{ 'common.noRecords' | trans }}</p>
    }
  </div>

  @if (hasMore()) {
    <button
      type="button"
      (click)="viewAll.emit()"
      class="cursor-pointer self-start rounded text-label-md font-semibold text-primary-container transition-colors hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface-container"
    >
      {{ 'common.seeMore' | trans }}
    </button>
  }
</section>
