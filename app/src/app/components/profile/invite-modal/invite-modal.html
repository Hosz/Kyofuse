<app-modal [open]="open()" [title]="modalTitle()" (closed)="closed.emit()">
  <div class="flex flex-col gap-lg">
    @if (loading()) {
      <p class="py-6 text-center text-body-sm text-on-surface-variant">{{ 'common.loading' | trans }}</p>
    } @else {
      <div class="flex flex-col gap-md">
        @for (team of ownedTeams(); track team.id) {
          <div class="flex items-center gap-3">
            @if (team.avatarUrl) {
              <img [src]="team.avatarUrl" [alt]="team.name" class="h-11 w-11 shrink-0 rounded-lg object-cover" />
            } @else {
              <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg bg-tertiary-container/20 text-tertiary">
                <span class="material-symbols-outlined text-[22px]">groups</span>
              </div>
            }

            <div class="flex min-w-0 flex-1 flex-col">
              <span class="truncate text-body-sm font-semibold text-on-surface">{{ team.name }}</span>
              <span class="truncate text-label-sm uppercase text-on-surface-variant">{{ team.slug }}</span>
            </div>

            <button
              type="button"
              (click)="invite(team)"
              [disabled]="stateOf(team.id) === 'sending' || stateOf(team.id) === 'sent'"
              class="shrink-0 cursor-pointer rounded-full px-4 py-1.5 text-label-md font-bold transition-colors disabled:cursor-not-allowed focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface-container-low"
              [class]="
                stateOf(team.id) === 'sent'
                  ? 'border border-outline-variant text-on-surface-variant'
                  : 'bg-primary-container text-on-primary-container hover:brightness-110'
              "
            >
              {{ label(team.id) }}
            </button>
          </div>
        } @empty {
          <p class="py-4 text-center text-body-sm text-on-surface-variant">
            {{ 'modals.noTeamsToInvite' | trans }}
          </p>
        }
      </div>
    }
  </div>
</app-modal>
