@if (highlights().length > 0) {
  <section class="flex flex-col gap-md">
    <h2 class="flex items-center gap-2 text-label-md font-bold uppercase tracking-[0.05em] text-on-surface-variant">
      <span class="material-symbols-outlined text-primary text-[18px]">star</span>
      Destaques
    </h2>

    <div class="flex flex-wrap gap-4">
      @for (highlight of highlights(); track highlight.label) {
        <button
          type="button"
          (click)="openHighlight(highlight)"
          class="flex cursor-pointer flex-col items-center gap-2 rounded-lg text-center transition-transform hover:-translate-y-0.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface"
        >
          <span
            class="flex h-16 w-16 items-center justify-center rounded-xl border-2 border-primary-container bg-surface-container text-primary transition-colors hover:bg-surface-container-high"
          >
            <span class="material-symbols-outlined text-[26px]">{{ highlight.icon }}</span>
          </span>
          <span class="text-label-sm text-on-surface-variant">{{ highlight.label }}</span>
        </button>
      }
    </div>
  </section>
}
