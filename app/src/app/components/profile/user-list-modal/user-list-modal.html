<app-modal [open]="open()" [title]="title()" (closed)="closed.emit()">
  <div class="flex flex-col gap-md">
    @if (restricted()) {
      <div class="flex flex-col items-center gap-2 py-8 text-center">
        <span class="material-symbols-outlined text-[28px] text-on-surface-variant">lock</span>
        <p class="text-body-sm text-on-surface-variant">{{ 'profile.privateAccountDesc' | trans }}</p>
      </div>
    } @else {
      @for (user of users(); track user.id) {
        <app-user-row
          [userId]="user.id"
          [name]="user.name"
          [handle]="user.handle"
          [avatarUrl]="user.avatarUrl"
          [isFollowing]="user.isFollowing ?? null"
          (actionClick)="toggleFollow.emit(user)"
          (userClick)="closed.emit()"
        >
          <!-- O elemento com [rowActions] precisa ser estático: dentro de um @if, o
               seletor do ng-content não casa e o conteúdo é descartado. O @if fica aqui
               dentro, e o hidden tira o span do layout pra não sobrar o gap da linha. -->
          <span rowActions [hidden]="!hasRowActions()">
            @if (hasRowActions()) {
              <app-user-options-menu
                [userId]="user.id"
                presentation="modal"
                [canRemoveFollower]="canManageFollowers()"
                [canUnfollow]="canUnfollow()"
                [canRemoveFriend]="canRemoveFriend()"
                (followerRemoved)="removeFromList(user.id)"
                (unfollowed)="removeFromList(user.id)"
                (friendRemoved)="removeFromList(user.id)"
                (blocked)="removeFromList(user.id)"
              />
            }
          </span>
        </app-user-row>
      } @empty {
        <p class="py-6 text-center text-body-sm text-on-surface-variant">{{ 'modals.noUsersFound' | trans }}</p>
      }
    }

    @if (!restricted() && hasMoreToLoad()) {
      <button
        type="button"
        (click)="loadMore()"
        [disabled]="loadingMore()"
        class="mx-auto cursor-pointer whitespace-nowrap rounded-full border border-outline-variant px-5 py-2 text-label-sm font-bold text-on-surface-variant transition-colors hover:bg-surface-container-high hover:text-on-surface disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ (loadingMore() ? 'common.loading' : 'profile.loadMore') | trans }}
      </button>
    }
  </div>
</app-modal>
