<app-modal [open]="open()" [title]="title()" size="compact" (closed)="cancelled.emit()">
  <div class="flex flex-col gap-md px-2 py-1">
    <p class="text-body-sm text-on-surface-variant">{{ message() }}</p>

    @if (error()) {
      <p class="text-label-sm text-error">{{ error() }}</p>
    }

    <div class="flex justify-end gap-2">
      <button
        type="button"
        (click)="cancelled.emit()"
        [disabled]="pending()"
        class="cursor-pointer rounded-full border border-outline-variant px-4 py-2 text-label-sm font-bold text-on-surface transition-colors hover:bg-surface-container-high disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ cancelLabel() }}
      </button>
      <button
        type="button"
        (click)="confirmed.emit()"
        [disabled]="pending()"
        class="cursor-pointer rounded-full px-4 py-2 text-label-sm font-bold transition-all hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-60"
        [class]="destructive() ? 'bg-error text-on-error' : 'bg-primary-container text-on-primary-container'"
      >
        {{ pending() ? 'Aguarde...' : confirmLabel() }}
      </button>
    </div>
  </div>
</app-modal>
