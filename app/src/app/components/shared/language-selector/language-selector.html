<div class="relative inline-block text-left" (click)="$event.stopPropagation()">
  <button
    type="button"
    (click)="toggle()"
    class="flex items-center gap-2 rounded-xl border border-outline-variant bg-surface-container px-3 py-2 text-body-sm font-semibold text-on-surface transition-all hover:bg-surface-container-high active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container"
    [attr.aria-expanded]="open()"
    aria-label="Selecionar idioma"
  >
    <span class="text-base leading-none">{{ currentLangInfo().flag }}</span>
    @if (!compact()) {
      <span class="truncate">{{ currentLangInfo().name }}</span>
      <span class="material-symbols-outlined text-[18px] text-on-surface-variant transition-transform" [class.rotate-180]="open()">
        expand_more
      </span>
    }
  </button>

  @if (open()) {
    <div
      class="absolute right-0 z-50 mt-1.5 w-56 origin-top-right rounded-2xl border border-outline-variant bg-surface-container-low p-1.5 shadow-2xl backdrop-blur-xl ring-1 ring-black/5 focus:outline-none"
      [class.left-0]="alignLeft()"
      [class.right-auto]="alignLeft()"
    >
      <div class="px-2.5 py-2 border-b border-outline-variant/60 mb-1">
        <p class="text-label-sm font-bold uppercase tracking-wider text-on-surface-variant">
          {{ 'settings.languageTitle' | trans }}
        </p>
      </div>

      <div class="max-h-64 overflow-y-auto scrollbar-minimal flex flex-col gap-0.5">
        @for (lang of supportedLanguages; track lang.code) {
          <button
            type="button"
            (click)="selectLanguage(lang.code)"
            class="flex w-full items-center justify-between rounded-xl px-3 py-2 text-left text-body-sm transition-colors"
            [class]="
              currentLang() === lang.code
                ? 'bg-primary-container/15 text-primary font-bold'
                : 'text-on-surface hover:bg-surface-container'
            "
          >
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="text-lg leading-none shrink-0">{{ lang.flag }}</span>
              <div class="flex flex-col min-w-0">
                <span class="truncate leading-tight">{{ lang.name }}</span>
                <span class="truncate text-[11px] text-on-surface-variant leading-tight">{{ lang.englishName }}</span>
              </div>
            </div>

            @if (currentLang() === lang.code) {
              <span class="material-symbols-outlined text-[18px] text-primary shrink-0">check</span>
            }
          </button>
        }
      </div>
    </div>
  }
</div>
