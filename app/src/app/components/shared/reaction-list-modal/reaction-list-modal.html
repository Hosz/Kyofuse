<app-modal [open]="open()" title="Reações" (closed)="closed.emit()">
  <div class="flex flex-col gap-md">
    @if (loading()) {
      <p class="py-8 text-center text-body-sm text-on-surface-variant">Carregando...</p>
    } @else if (error()) {
      <p class="py-8 text-center text-body-sm text-error">{{ error() }}</p>
    } @else {
      @for (entry of entries(); track entry.userId) {
        <div class="flex items-center gap-2">
          <app-user-row
            class="flex-1"
            [userId]="entry.userId"
            [name]="entry.nickname"
            [handle]="entry.username"
            [avatarUrl]="entry.avatarUrl"
          />
          <span
            class="material-symbols-outlined shrink-0 text-[18px] text-on-surface-variant"
            [title]="reactionLabel(entry.reactionType)"
          >
            {{ reactionIcon(entry.reactionType) }}
          </span>
        </div>
      } @empty {
        <p class="py-6 text-center text-body-sm text-on-surface-variant">Ninguém reagiu ainda.</p>
      }

      @if (hasMoreToLoad()) {
        <button
          type="button"
          (click)="loadMore()"
          [disabled]="loadingMore()"
          class="mx-auto cursor-pointer whitespace-nowrap rounded-full border border-outline-variant px-5 py-2 text-label-sm font-bold text-on-surface-variant transition-colors hover:bg-surface-container-high hover:text-on-surface disabled:cursor-not-allowed disabled:opacity-60"
        >
          {{ loadingMore() ? 'Carregando...' : 'Carregar mais' }}
        </button>
      }
    }
  </div>
</app-modal>
