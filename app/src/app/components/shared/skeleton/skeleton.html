@for (item of items; track item) {
  @switch (variant()) {
    @case ('post') {
      <div class="flex gap-3 border-b border-outline-variant px-lg py-md">
        <span class="skeleton-block h-11 w-11 shrink-0 rounded-full"></span>
        <div class="flex flex-1 flex-col gap-2">
          <span class="skeleton-block h-3 w-1/3 rounded"></span>
          <span class="skeleton-block h-3 w-full rounded"></span>
          <span class="skeleton-block h-3 w-4/5 rounded"></span>
          <span class="skeleton-block mt-1 h-3 w-24 rounded"></span>
        </div>
      </div>
    }
    @case ('conversation') {
      <div class="flex items-center gap-3 border-b border-outline-variant px-4 py-2.5">
        <span class="skeleton-block h-9 w-9 shrink-0 rounded-full"></span>
        <div class="flex flex-1 flex-col gap-1.5">
          <span class="skeleton-block h-3 w-2/5 rounded"></span>
          <span class="skeleton-block h-2.5 w-1/4 rounded"></span>
        </div>
      </div>
    }
    @default {
      <div class="flex items-center gap-3 py-2">
        <span class="skeleton-block h-11 w-11 shrink-0 rounded-full"></span>
        <div class="flex flex-1 flex-col gap-1.5">
          <span class="skeleton-block h-3 w-1/3 rounded"></span>
          <span class="skeleton-block h-2.5 w-1/5 rounded"></span>
        </div>
      </div>
    }
  }
}
