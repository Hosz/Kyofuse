<button
  type="button"
  (click)="selected.emit(member())"
  class="flex w-full cursor-pointer items-center gap-3 rounded-lg px-2 py-2.5 text-left transition-colors hover:bg-surface-container-high focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container"
>
  <img
    [src]="member().avatarUrl || fallbackAvatar"
    [alt]="displayName()"
    class="h-10 w-10 shrink-0 rounded-full object-cover"
  />

  <span class="flex min-w-0 flex-1 flex-col">
    <span class="truncate text-body-sm font-semibold text-on-surface">{{ displayName() }}</span>
    <span class="truncate text-label-sm text-on-surface-variant">
      &#64;{{ member().userName }} &#183; {{ roleLabel() || 'Sem papel' }} &#183; {{ statusLabel() }}
    </span>
  </span>

  @if (isOwner()) {
    <span class="shrink-0 rounded-md border border-primary-container px-2 py-0.5 text-label-sm font-semibold text-primary-container">
      Dono
    </span>
  } @else if (canManage()) {
    <span class="material-symbols-outlined shrink-0 text-[20px] text-on-surface-variant">more_horiz</span>
  } @else {
    <span class="material-symbols-outlined shrink-0 text-[20px] text-on-surface-variant">chevron_right</span>
  }
</button>
