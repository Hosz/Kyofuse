<div class="tactical-grid flex min-h-screen w-full items-center justify-center bg-surface px-6 py-16">
  <div class="flex w-full max-w-6xl flex-col items-center gap-16 lg:flex-row lg:items-center lg:justify-center">
    <app-auth-hero class="flex-1" />

    <div class="w-full max-w-[24rem] shrink-0">
      <div class="overflow-hidden rounded-xl border border-b-2 border-outline-variant border-b-primary-container bg-surface-container-low">
        <app-auth-tabs [active]="activeTab()" (tabSelected)="onTabSelected($event)" />

        <div class="flex flex-col gap-lg px-lg py-lg">
          @if (activeTab() === 'login') {
            <app-login-form (submitLogin)="onLogin($event)" />
          } @else {
            <app-register-form (submitRegister)="onRegister($event)" />
          }

          <app-social-auth-buttons />
        </div>

        <div class="border-t border-outline-variant bg-surface-container px-lg py-3.5 text-center">
          <button
            type="button"
            (click)="toggleTab()"
            class="cursor-pointer rounded text-label-sm text-on-surface-variant transition-colors hover:text-on-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-container focus-visible:ring-offset-2 focus-visible:ring-offset-surface-container"
          >
            @if (activeTab() === 'login') {
              Ainda não faz parte da unidade?
              <span class="font-bold text-primary-container">Registrar</span>
            } @else {
              Já faz parte da unidade?
              <span class="font-bold text-primary-container">Entrar no Sistema</span>
            }
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
