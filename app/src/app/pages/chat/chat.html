<div class="tactical-grid flex h-screen w-full overflow-hidden bg-surface">
  <div class="shell-container flex h-screen">
    <app-sidebar />

    <div
      class="h-full w-full shrink-0 min-h-0 lg:w-96"
      [class.hidden]="selectedId() !== null"
      [class.lg:block]="true"
    >
      <app-conversation-list
        [conversations]="allConversations()"
        [selectedId]="selectedId()"
        (select)="onSelectConversation($event)"
        (newConversation)="openNewConversationModal()"
      />
    </div>

    <div
      class="h-full flex-1 min-w-0 min-h-0"
      [class.hidden]="selectedId() === null"
      [class.lg:block]="true"
    >
      <app-chat-window
        [conversation]="selectedConversation()"
        [myUserId]="myUserIdValue()"
        [loadingOlderMessages]="loadingOlderMessages()"
        (loadOlderMessages)="onLoadOlderMessages()"
        (groupUpdated)="onGroupUpdated($event)"
        (accept)="onAccept()"
        (decline)="onDecline()"
        (revoke)="onRevoke()"
        (allow)="onAllow()"
        (sendMessage)="onSendMessage($event)"
        (deleteMessage)="onDeleteMessage($event)"
        (back)="onBackToConversations()"
      />
    </div>
  </div>

  <app-new-conversation-modal
    [open]="activeModal() === 'new-conversation'"
    (closed)="closeModal()"
    (startDirect)="onStartDirectConversation($event)"
    (createGroup)="onCreateGroupConversation($event)"
  />
</div>
