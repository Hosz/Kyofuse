<section class="flex flex-col gap-lg rounded-xl border border-outline-variant bg-surface-container-low p-lg">
  <div class="flex items-center justify-between border-b border-outline-variant pb-3">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-primary">article</span>
      <h2 class="text-title-md font-bold text-on-surface">Visibilidade de Conteúdo</h2>
    </div>
    <span class="rounded-md border border-outline-variant px-2 py-1 text-label-sm text-on-surface-variant">Módulo 02</span>
  </div>

  <div class="grid grid-cols-1 gap-lg sm:grid-cols-3">
    <label class="flex flex-col gap-1.5">
      <span class="text-label-sm font-semibold text-on-surface-variant">Suas publicações</span>
      <select
        [value]="store.postVisibility()"
        (change)="store.postVisibility.set($any($event.target).value)"
        class="rounded-lg border border-outline-variant bg-surface-container px-3 py-2.5 text-body-sm text-on-surface outline-none focus:border-primary"
      >
        @for (option of options; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </label>
    <label class="flex flex-col gap-1.5">
      <span class="text-label-sm font-semibold text-on-surface-variant">Suas curtidas</span>
      <select
        [value]="store.likesVisibility()"
        (change)="store.likesVisibility.set($any($event.target).value)"
        class="rounded-lg border border-outline-variant bg-surface-container px-3 py-2.5 text-body-sm text-on-surface outline-none focus:border-primary"
      >
        @for (option of options; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </label>
    <label class="flex flex-col gap-1.5">
      <span class="text-label-sm font-semibold text-on-surface-variant">Seus reposts</span>
      <select
        [value]="store.repostsVisibility()"
        (change)="store.repostsVisibility.set($any($event.target).value)"
        class="rounded-lg border border-outline-variant bg-surface-container px-3 py-2.5 text-body-sm text-on-surface outline-none focus:border-primary"
      >
        @for (option of options; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </label>
  </div>

  @if (store.error()) {
    <p class="text-label-sm text-error">{{ store.error() }}</p>
  }

  <div class="flex items-center gap-3 border-t border-outline-variant pt-lg">
    <a
      routerLink="/perfil"
      class="cursor-pointer rounded-full border border-outline-variant px-4 py-2 text-label-md font-bold text-on-surface transition-colors hover:bg-surface-container-high"
    >
      Voltar
    </a>
    <button
      type="button"
      (click)="save()"
      [disabled]="store.saving()"
      class="cursor-pointer rounded-full bg-secondary-fixed px-4 py-2 text-label-md font-bold text-on-secondary transition-colors hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-60"
    >
      {{ store.saving() ? 'Salvando...' : 'Salvar' }}
    </button>
    @if (saved()) {
      <span class="flex items-center gap-1 text-label-sm font-semibold text-tertiary">
        <span class="material-symbols-outlined text-[16px]">check_circle</span>
        Salvo
      </span>
    }
  </div>
</section>
