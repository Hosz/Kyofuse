<section class="flex flex-col gap-lg rounded-xl border border-outline-variant bg-surface-container-low p-lg">
  <div class="flex items-center justify-between border-b border-outline-variant pb-3">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-primary">shield_person</span>
      <h2 class="text-title-md font-bold text-on-surface">Permissões de Interação</h2>
    </div>
    <span class="rounded-md border border-outline-variant px-2 py-1 text-label-sm text-on-surface-variant">Módulo 04</span>
  </div>

  <div class="grid grid-cols-1 gap-lg sm:grid-cols-2">
    <label class="flex flex-col gap-1.5">
      <span class="text-label-sm font-semibold text-on-surface-variant">Quem pode te enviar mensagem</span>
      <select
        [value]="store.messagePermission()"
        (change)="store.messagePermission.set($any($event.target).value)"
        class="rounded-lg border border-outline-variant bg-surface-container px-3 py-2.5 text-body-sm text-on-surface outline-none focus:border-primary"
      >
        @for (option of messagePermissionOptions; track option.value) {
          <option [value]="option.value" [selected]="option.value === store.messagePermission()">{{ option.label }}</option>
        }
      </select>
    </label>
    <label class="flex flex-col gap-1.5">
      <span class="text-label-sm font-semibold text-on-surface-variant">Quem pode te pedir amizade</span>
      <select
        [value]="store.friendRequestPermission()"
        (change)="store.friendRequestPermission.set($any($event.target).value)"
        class="rounded-lg border border-outline-variant bg-surface-container px-3 py-2.5 text-body-sm text-on-surface outline-none focus:border-primary"
      >
        @for (option of friendRequestPermissionOptions; track option.value) {
          <option [value]="option.value" [selected]="option.value === store.friendRequestPermission()">{{ option.label }}</option>
        }
      </select>
    </label>
    <label class="flex flex-col gap-1.5">
      <span class="text-label-sm font-semibold text-on-surface-variant">Quem pode te seguir</span>
      <select
        [value]="store.followPermission()"
        (change)="store.followPermission.set($any($event.target).value)"
        class="rounded-lg border border-outline-variant bg-surface-container px-3 py-2.5 text-body-sm text-on-surface outline-none focus:border-primary"
      >
        @for (option of followPermissionOptions; track option.value) {
          <option [value]="option.value" [selected]="option.value === store.followPermission()">{{ option.label }}</option>
        }
      </select>
    </label>
    <label class="flex flex-col gap-1.5">
      <span class="text-label-sm font-semibold text-on-surface-variant">Quem pode te convidar pra time</span>
      <select
        [value]="store.teamInvitePermission()"
        (change)="store.teamInvitePermission.set($any($event.target).value)"
        class="rounded-lg border border-outline-variant bg-surface-container px-3 py-2.5 text-body-sm text-on-surface outline-none focus:border-primary"
      >
        @for (option of teamInvitePermissionOptions; track option.value) {
          <option [value]="option.value" [selected]="option.value === store.teamInvitePermission()">{{ option.label }}</option>
        }
      </select>
    </label>
    <label class="flex flex-col gap-1.5">
      <span class="text-label-sm font-semibold text-on-surface-variant">Quem pode te convidar pra duo</span>
      <select
        [value]="store.duoInvitePermission()"
        (change)="store.duoInvitePermission.set($any($event.target).value)"
        class="rounded-lg border border-outline-variant bg-surface-container px-3 py-2.5 text-body-sm text-on-surface outline-none focus:border-primary"
      >
        @for (option of duoInvitePermissionOptions; track option.value) {
          <option [value]="option.value" [selected]="option.value === store.duoInvitePermission()">{{ option.label }}</option>
        }
      </select>
    </label>
  </div>

  @if (store.error()) {
    <p class="text-label-sm text-error">{{ store.error() }}</p>
  }

  <div class="flex items-center gap-3 border-t border-outline-variant pt-lg">
    <a
      routerLink="/perfil"
      class="cursor-pointer rounded-full border border-outline-variant px-4 py-2 text-label-md font-bold text-on-surface transition-colors hover:bg-surface-container-high"
    >
      Voltar
    </a>
    <button
      type="button"
      (click)="save()"
      [disabled]="store.saving()"
      class="cursor-pointer rounded-full bg-secondary-fixed px-4 py-2 text-label-md font-bold text-on-secondary transition-colors hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-60"
    >
      {{ store.saving() ? 'Salvando...' : 'Salvar' }}
    </button>
    @if (saved()) {
      <span class="flex items-center gap-1 text-label-sm font-semibold text-tertiary">
        <span class="material-symbols-outlined text-[16px]">check_circle</span>
        Salvo
      </span>
    }
  </div>
</section>
